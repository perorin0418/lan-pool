# pool.conf - LAN 共有ストレージ（mergerfs + NFSv4）の設定
# 全 PC で同じ内容のファイルを使ってください。
# ホストは IP アドレスで書いてください（NFS の許可判定が名前解決に左右されないため）。
# 各 PC の IP は DHCP の予約などで固定してください。

# 自宅 LAN のネットワーク範囲（ファイアウォールで NFS を許可する範囲）
LAN_CIDR="192.168.1.0/24"

# ストレージを提供する PC（自分のディスクを共有ストレージに加える）
NODES=(
  "192.168.1.10"
  "192.168.1.11"
  "192.168.1.12"
)

# ストレージを提供せず、共有ストレージを使うだけの PC（いなければ空のまま）
# 追加・削除したら、NODES の全 PC でも install をやり直してください（公開先を更新するため）
CLIENTS=(
  # "192.168.1.20"
)

# 各 PC で共有に提供するディレクトリ（この下の pool-data/ にデータが入る）
DISK_DIR="/srv/disk"
DATA_SUBDIR="pool-data"

# 他の PC のディスクをマウントする場所
BRANCH_BASE="/mnt/branches"

# 共有ストレージのパス（全 PC で同じパスに見える）
POOL_DIR="/mnt/pool"

# 空きがこれ未満のディスクには新しいファイルを置かない
MINFREE="20G"

# mergerfs のバージョン（空なら GitHub の最新リリース）
MERGERFS_VERSION=""
